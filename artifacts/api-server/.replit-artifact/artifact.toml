kind = "api"
previewPath = "/api" # API service is mounted at /api
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["bash", "-lc", "cd ../.. && uv sync --no-dev --frozen"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["bash", "-lc", "cd ../.. && uv run --no-sync --project . python -m uvicorn backend.main:app --host 0.0.0.0 --port 8080"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
